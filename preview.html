<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview Hero · EBS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400&family=Caveat:wght@400;500&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --white:#FFFFFF; --ink:#2C2C2C; --grey:#8A8A8A; --gold:#9A8E7E; --gold-pale:#EDE8DF; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--white);color:var(--ink);font-family:'Montserrat',sans-serif;font-weight:300;line-height:1.7}

  /* HERO */
  .hero{
    padding: 24px 28px 80px;
    text-align: center;
    max-width: 1080px;
    margin: 0 auto;
  }
  .hero-logo{
    max-width: 110px; width:100%; height:auto;
    display:block; margin: 0 auto 28px;
  }
  .hero-img-wrap{
    width: 100%;
    max-height: 360px;
    overflow: hidden;
    border-radius: 8px;
    margin: 0 0 40px;
  }
  .hero-img-wrap img{
    width:100%; height:100%; object-fit:cover;
    filter: grayscale(100%);
    aspect-ratio: 16/6;
  }
  h1{
    font-family:'Playfair Display',serif;
    font-weight:500;
    font-size: clamp(36px, 5.5vw, 64px);
    line-height:1.1;
    color:var(--ink);
    letter-spacing:-0.015em;
    margin-bottom: 22px;
    max-width: 880px;
    margin-left:auto; margin-right:auto;
  }
  h1 em{
    font-style:italic; color:var(--gold); font-weight:500;
  }
  .subtitle{
    font-family:'Playfair Display',serif;
    font-style: italic;
    font-size: clamp(18px, 2.5vw, 24px);
    color:var(--grey);
    margin: 0 auto 56px;
    max-width: 620px;
    line-height: 1.5;
  }

  /* JOURNEY */
  .journey-label{
    font-family: 'Caveat', cursive;
    font-size: clamp(28px, 3.5vw, 40px);
    color: var(--ink);
    margin-bottom: 32px;
  }
  .journey-row{
    display:grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    max-width: 720px;
    margin: 0 auto 12px;
    align-items: center;
    position: relative;
  }
  .journey-row::before{
    content:'';
    position:absolute;
    left: 8%; right: 8%;
    top: 50%;
    height: 1px;
    background: var(--gold-pale);
    z-index: 0;
  }
  .journey-dot{
    width: 22px; height: 22px;
    border-radius: 50%;
    margin: 0 auto;
    position: relative; z-index: 1;
    border: 1.5px solid var(--ink);
    background: var(--white);
  }
  .journey-dot--1{ background:#EDE8DF; border-color:#C9C0B2; }
  .journey-dot--2{ background:#C9C0B2; border-color:#9A8E7E; }
  .journey-dot--3{ background:#9A8E7E; border-color:#9A8E7E; }
  .journey-dot--4{ background:#5C5752; border-color:#5C5752; }
  .journey-dot--5{ background:#2C2C2C; border-color:#2C2C2C; }

  .journey-labels{
    display:grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    max-width: 720px;
    margin: 0 auto;
  }
  .journey-text{
    font-family:'Caveat', cursive;
    font-size: clamp(18px, 2vw, 22px);
    color: var(--ink);
    text-align:center;
    line-height:1.2;
  }

  @media (max-width: 640px){
    .hero{ padding: 16px 20px 56px; }
    h1{ font-size: 34px; }
    .journey-row, .journey-labels{
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }
    .journey-text{ font-size: 14px; }
    .journey-dot{ width: 16px; height: 16px; }
  }
</style>
</head>
<body>

<section class="hero">
  <img src="https://static.wixstatic.com/media/ab43f7_dcfcecfadc7a49aeaebdafc5710efd2b~mv2.png" alt="Event Business School" class="hero-logo">

  <h1>Constrói o teu Negócio<br>de Eventos <em>Único</em></h1>
  <p class="subtitle">Vive de eventos: faz o que gostas, sê bem paga e tem liberdade para decidir o que fazer da tua vida.</p>

  <div class="journey-label">a tua jornada</div>

  <div class="journey-row">
    <div><div class="journey-dot journey-dot--1"></div></div>
    <div><div class="journey-dot journey-dot--2"></div></div>
    <div><div class="journey-dot journey-dot--3"></div></div>
    <div><div class="journey-dot journey-dot--4"></div></div>
    <div><div class="journey-dot journey-dot--5"></div></div>
  </div>

  <div class="journey-labels">
    <div class="journey-text">faço<br>eventos</div>
    <div class="journey-text">sou bem<br>paga</div>
    <div class="journey-text">destaco-me</div>
    <div class="journey-text">clientes<br>todos os meses</div>
    <div class="journey-text">vivo de<br>eventos</div>
  </div>
</section>

</body>
</html>
