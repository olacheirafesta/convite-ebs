<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview Hero · EBS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400&family=Caveat:wght@400;500&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --white:#FFFFFF; --ink:#2C2C2C; --grey:#8A8A8A; --gold:#9A8E7E; --gold-pale:#EDE8DF; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--white);color:var(--ink);font-family:'Montserrat',sans-serif;font-weight:300;line-height:1.7}

  /* HERO */
  .hero{
    padding: 24px 28px 80px;
    text-align: center;
    max-width: 1080px;
    margin: 0 auto;
  }
  .hero-banner{
    position: relative;
    width: 100%;
    overflow: hidden;
    border-radius: 8px;
    margin: 0 0 40px;
  }
  .hero-banner img{
    width:100%; display:block;
    aspect-ratio: 16/6;
    object-fit:cover;
    filter: grayscale(100%);
  }
  .hero-banner-logo{
    position: absolute;
    top: 24px; left: 28px;
    max-width: 110px; height: auto;
    filter: brightness(0) invert(1);
  }
  @media (max-width: 640px){
    .hero-banner-logo{ top: 14px; left: 16px; max-width: 80px; }
  }
  h1{
    font-family:'Playfair Display',serif;
    font-weight:500;
    font-size: clamp(36px, 5.5vw, 64px);
    line-height:1.1;
    color:var(--ink);
    letter-spacing:-0.015em;
    margin-bottom: 22px;
    max-width: 880px;
    margin-left:auto; margin-right:auto;
  }
  h1 em{
    font-style:italic; color:var(--gold); font-weight:500;
  }
  .subtitle{
    font-family:'Playfair Display',serif;
    font-style: italic;
    font-size: clamp(18px, 2.5vw, 24px);
    color:var(--gold);
    margin: 0 auto 56px;
    max-width: 620px;
    line-height: 1.5;
  }

  /* JOURNEY */
  .journey-label{
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 36px;
  }
  .journey-row{
    display:grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    max-width: 720px;
    margin: 0 auto 12px;
    align-items: center;
    position: relative;
  }
  .journey-row::before{
    content:'';
    position:absolute;
    left: 8%; right: 8%;
    top: 50%;
    height: 1px;
    background: var(--gold-pale);
    z-index: 0;
  }
  .journey-dot{
    width: 22px; height: 22px;
    border-radius: 50%;
    margin: 0 auto;
    position: relative; z-index: 1;
    border: 1.5px solid var(--ink);
    background: var(--white);
  }
  .journey-dot--1{ background:#EDE8DF; border: none; }
  .journey-dot--2{ background:#C9C0B2; border: none; }
  .journey-dot--3{ background:#9A8E7E; border-color:#9A8E7E; }
  .journey-dot--4{ background:#5C5752; border-color:#5C5752; }
  .journey-dot--5{ background:#2C2C2C; border-color:#2C2C2C; }

  .journey-labels{
    display:grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    max-width: 720px;
    margin: 0 auto;
  }
  .journey-num{
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 13px;
    color: var(--gold);
    text-align: center;
    margin-bottom: 4px;
  }
  .journey-text{
    font-family: 'Montserrat', sans-serif;
    font-weight: 500;
    font-size: 11px;
    letter-spacing: 0.05em;
    color: var(--ink);
    text-align: center;
    line-height: 1.3;
  }

  @media (max-width: 640px){
    .hero{ padding: 16px 20px 56px; }
    h1{ font-size: 34px; }
    .journey-row, .journey-labels{
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }
    .journey-text{ font-size: 14px; }
    .journey-dot{ width: 16px; height: 16px; }
  }

  /* FOOTER */
  .site-footer{
    border-top: 1px solid var(--gold-pale);
    padding: 36px 28px 28px;
    text-align: center;
    margin-top: 32px;
  }
  .site-footer img{
    max-width: 110px; height: auto;
    display: block;
    margin: 0 auto 14px;
    opacity: 0.85;
  }
  .site-footer-text{
    font-family: 'Montserrat', sans-serif;
    font-size: 10px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 400;
  }
</style>
</head>
<body>

<section class="hero">
  <div class="hero-banner">
    <img src="https://static.wixstatic.com/media/ab43f7_f493b40075c946f7a5ef87e22354c104~mv2.jpg" alt="Comunidade Event Business School">
    <img src="https://static.wixstatic.com/media/ab43f7_dcfcecfadc7a49aeaebdafc5710efd2b~mv2.png" alt="Event Business School" class="hero-banner-logo">
  </div>

  <h1>Constrói o teu Negócio<br>de Eventos <em>Único</em></h1>
  <p class="subtitle">Vive de eventos: faz o que gostas, sê bem paga e tem liberdade para decidir o que fazer da tua vida.</p>

  <div class="journey-label">— A Tua Jornada —</div>

  <div class="journey-row">
    <div><div class="journey-dot journey-dot--1"></div></div>
    <div><div class="journey-dot journey-dot--2"></div></div>
    <div><div class="journey-dot journey-dot--3"></div></div>
    <div><div class="journey-dot journey-dot--4"></div></div>
    <div><div class="journey-dot journey-dot--5"></div></div>
  </div>

  <div class="journey-labels">
    <div><div class="journey-num">01</div><div class="journey-text">Faço eventos</div></div>
    <div><div class="journey-num">02</div><div class="journey-text">Sou bem paga</div></div>
    <div><div class="journey-num">03</div><div class="journey-text">Destaco-me</div></div>
    <div><div class="journey-num">04</div><div class="journey-text">Clientes todos<br>os meses</div></div>
    <div><div class="journey-num">05</div><div class="journey-text">Vivo de eventos</div></div>
  </div>
</section>

<footer class="site-footer">
  <img src="https://static.wixstatic.com/media/ab43f7_dcfcecfadc7a49aeaebdafc5710efd2b~mv2.png" alt="Event Business School">
  <div class="site-footer-text">Adriana Godinho &nbsp;·&nbsp; 2026</div>
</footer>

</body>
</html>
